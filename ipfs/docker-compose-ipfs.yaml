version: '3.7'

services:
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: ipfs-node
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ./ipfs-data:/data/ipfs
      - ./ipfs-export:/export
    ports:
      - "4001:4001"     # IPFS swarm
      - "5001:5001"     # API server
      - "8080:8080"     # Gateway
    networks:
      - ehr_network
    restart: unless-stopped

networks:
  ehr_network:
    external: true